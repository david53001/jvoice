name: Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  push:
    branches: [main, "windows-port", "feat/**", "fix/**"]
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"

# No special permissions — this workflow never releases, and writes to the repo only in the opt-in
# ui-snapshot job below (feat/ai-polish-windows + "[ui-snapshot]" in the commit message).
permissions:
  contents: read

jobs:
  build-test:
    name: build + dotnet test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore windows/JVoice.sln

      - name: Build (Release)
        run: dotnet build windows/JVoice.sln -c Release --no-restore

      # Run the xUnit suite (JVoice.Core's brain + pure helpers). The native Whisper
      # engine, the WPF GUI, and the verify-transcription harness are NOT exercised
      # here — they need a GPU/mic/model and a desktop session, which CI runners lack.
      - name: Test (JVoice.Tests)
        run: >
          dotnet test windows/JVoice.Tests/JVoice.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory "${{ github.workspace }}/test-results"

      # Guard against the silent "0 tests ran" trap (the Windows analog of the macOS
      # workflow's swift-testing count check). Parse the .trx counters and fail if 0.
      - name: Assert tests actually ran
        shell: pwsh
        run: |
          $trx = Get-ChildItem "${{ github.workspace }}/test-results" -Recurse -Filter *.trx | Select-Object -First 1
          if (-not $trx) {
            Write-Error "No .trx test result file was produced — the test run did not execute."
            exit 1
          }
          [xml]$doc = Get-Content $trx.FullName
          $counters = $doc.TestRun.ResultSummary.Counters
          $total    = [int]$counters.total
          $executed = [int]$counters.executed
          $passed   = [int]$counters.passed
          $failed   = [int]$counters.failed
          Write-Host "Tests — total=$total executed=$executed passed=$passed failed=$failed"
          if ($total -le 0 -or $executed -le 0) {
            Write-Error "0 tests executed (total=$total, executed=$executed). The suite is being silently skipped."
            exit 1
          }
          if ($failed -gt 0) {
            Write-Error "$failed test(s) failed."
            exit 1
          }
          Write-Host "PASS: $passed/$total tests passed."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: "${{ github.workspace }}/test-results/*.trx"
          if-no-files-found: warn

      # Look at the UI without a Windows PC: render every surface (Settings incl. the AI Polish card
      # states, every HUD pill incl. "AI refining", Welcome, tour tags) off-screen with a throwaway
      # profile (never a real key or setting) and upload the PNGs. --ui-preview writes
      # _preview-log.txt (ok / FAIL per shot); a failed shot fails this step, but the artifact is
      # still uploaded so the failure can be seen.
      - name: Render UI preview (--ui-preview)
        if: always()
        shell: pwsh
        run: |
          $exe = Get-ChildItem windows/JVoice.App/bin -Recurse -Filter JVoice.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $exe) { Write-Error "JVoice.exe not found under windows/JVoice.App/bin"; exit 1 }
          Write-Host "Using $($exe.FullName)"
          $out = Join-Path "${{ github.workspace }}" "ui-preview"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList @('--ui-preview', $out) -Wait -PassThru
          if (Test-Path (Join-Path $out '_preview-log.txt')) { Get-Content (Join-Path $out '_preview-log.txt') }
          $err = Join-Path $env:TEMP 'jvoice-render-error.txt'
          if (Test-Path $err) { Write-Host '--- render error ---'; Get-Content $err }
          Write-Host "ui-preview exit code: $($p.ExitCode)"
          exit $p.ExitCode

      - name: Upload UI preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-preview
          path: "${{ github.workspace }}/ui-preview"
          if-no-files-found: warn

  # UI snapshots IN THE REPO, for reviewing the UI from an environment that can't download artifacts
  # (the cloud Claude sessions: their proxy blocks the artifact blob host). Runs ONLY for a push to
  # feat/ai-polish-windows whose commit message contains "[ui-snapshot]": takes the windows-ui-preview
  # PNGs, scales them to 1x (a quarter of the bytes), and commits them to
  # docs/ai-polish/windows-ui/ci/ on that same branch. Its commit touches only docs/, so it can't
  # re-trigger this workflow (paths filter). Every other run stays read-only.
  ui-snapshot:
    name: commit UI preview PNGs (feat/ai-polish-windows, [ui-snapshot] only)
    needs: build-test
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/feat/ai-polish-windows' && contains(github.event.head_commit.message, '[ui-snapshot]')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-polish-windows
      - uses: actions/download-artifact@v4
        with:
          name: windows-ui-preview
          path: ${{ github.workspace }}/ui-preview
      - name: Scale to 1x and commit
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $dest = 'docs/ai-polish/windows-ui/ci'
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          New-Item -ItemType Directory -Force $dest | Out-Null
          Get-ChildItem "${{ github.workspace }}/ui-preview" -Filter *.png | ForEach-Object {
            $img = [System.Drawing.Image]::FromFile($_.FullName)
            # Settings renders are 2x, HUD renders 3x: bring both to roughly 1x.
            $div = if ($_.Name -like 'hud-*') { 3 } else { 2 }
            $w = [int]($img.Width / $div); $h = [int]($img.Height / $div)
            $bmp = New-Object System.Drawing.Bitmap $w, $h
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $g.DrawImage($img, 0, 0, $w, $h)
            $bmp.Save((Join-Path $dest $_.Name), [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose(); $img.Dispose()
          }
          Copy-Item "${{ github.workspace }}/ui-preview/_preview-log.txt" $dest -ErrorAction SilentlyContinue
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $dest
          if (-not (git status --porcelain $dest)) { Write-Host 'No change in the snapshots.'; exit 0 }
          git commit -m "UI preview snapshots for ${{ github.sha }} (CI)"
          git push origin HEAD:feat/ai-polish-windows

  # OPTIONAL, OFF BY DEFAULT: produce the CPU build as a CI artifact for inspection.
  # It does NOT create a Release, does NOT push, does NOT run on PRs/forks.
  # Manually triggered via the Actions "Run workflow" UI (workflow_dispatch) only.
  build-artifact:
    name: build CPU single-file (artifact only)
    needs: build-test
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Publish CPU single-file
        run: >
          dotnet publish windows/JVoice.App/JVoice.App.csproj -c Release -r win-x64
          -p:JVoiceFlavor=cpu -p:PublishSingleFile=true -p:SelfContained=true
          -p:PublishTrimmed=false -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true -o ${{ github.workspace }}/out/cpu
      - name: Upload exe artifact (NOT a release)
        uses: actions/upload-artifact@v4
        with:
          name: JVoice-cpu-win-x64
          path: ${{ github.workspace }}/out/cpu/JVoice.exe
          if-no-files-found: error
