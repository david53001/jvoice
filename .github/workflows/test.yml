name: Test

on:
  pull_request:
  push:
    branches: [main, "feat/**", "fix/**"]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-test:
    name: swift test
    # macos-15 + Xcode 16 is required: swift-testing (`import Testing`) only
    # executes under `swift test` from Swift 6 / Xcode 16 toolchains. The old
    # macos-14 + Xcode 15.4 pin compiled the suite out via the
    # `#if canImport(Testing)` guards — 78 of 96 cases silently never ran.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_16.2.app 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
      - name: Resolve packages
        run: swift package resolve
      - name: Build release configuration
        # The shipped artifact (release DMG) is built in release config; CI
        # must compile it so a release-only break or `#else` fallback path
        # (non-WhisperKit branches) can't ship undetected.
        run: swift build -c release
      - name: Run tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log
      - name: Print test-process crash reports (on failure)
        # An abort of the test process (e.g. "Exited with unexpected signal code 6") prints no
        # reason in the log; the macOS crash report has the faulting thread and the abort message.
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, json, os, time
          found = glob.glob(os.path.expanduser("~/Library/Logs/DiagnosticReports/**/*.ips"), recursive=True) \
              + glob.glob("/Library/Logs/DiagnosticReports/**/*.ips", recursive=True)
          paths = [p for p in found if time.time() - os.path.getmtime(p) < 3600]
          print(f"{len(paths)} recent crash report(s)")
          for path in paths:
              print("=====", os.path.basename(path))
              try:
                  with open(path) as f:
                      header = json.loads(f.readline())
                      body = json.loads(f.read())
              except Exception as error:
                  print("unreadable:", error); continue
              print("process:", body.get("procName"), "| exception:", body.get("exception"))
              print("termination:", body.get("termination"))
              print("asi:", body.get("asi"))
              images = body.get("usedImages", [])
              threads = body.get("threads", [])
              fault = body.get("faultingThread", 0)
              for index in sorted({fault} | {i for i, t in enumerate(threads) if t.get("triggered")}):
                  if index >= len(threads): continue
                  thread = threads[index]
                  print(f"-- thread {index} {thread.get('name', '')} {thread.get('queue', '')}")
                  for frame in thread.get("frames", [])[:40]:
                      image = images[frame.get("imageIndex", 0)].get("name", "?") if images else "?"
                      print(f"   {image:28} {frame.get('symbol', hex(frame.get('imageOffset', 0)))}")
          PY
      - name: Run local logic verification scripts
        # These are the source of truth for the pure-logic core on a CLT-only
        # machine; running them in CI keeps them compiling/passing against
        # current sources (they need only the Swift toolchain — no WhisperKit,
        # no mic).
        run: |
          bash ./scripts/run-logic-tests.sh
          bash ./scripts/verify-streaming.sh
      - name: Settings smoke test (assembled .app)
        # Builds and draws the real Settings window from a bundle — the only check that catches an
        # AppKit/SwiftUI crash in Settings (see Sources/JVoice/UI/CLAUDE.md). Never starts the app.
        timeout-minutes: 3
        run: |
          APP="$RUNNER_TEMP/smoke/JVoice.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp .build/release/JVoice "$APP/Contents/MacOS/JVoice"
          cp Resources/Info.plist "$APP/Contents/Info.plist"
          "$APP/Contents/MacOS/JVoice" --settings-smoke
      - name: Verify the swift-testing suite actually ran
        # Two layers of protection against the `#if canImport(Testing)`
        # silent-skip trap:
        #   1. The swift-testing run summary must be present (XCTest output
        #      alone — the 4 fallback files — must NOT satisfy this).
        #   2. The executed-case count must track the authored count. Instead
        #      of a hard-coded floor (which erodes as the suite grows), count
        #      the authored `@Test` cases in Tests/ and require executed
        #      >= authored - 5 (a small slack for legitimate removals). This is
        #      self-maintaining: adding tests raises the floor automatically,
        #      while a wholesale silent skip still fails the build.
        run: |
          SUMMARY=$(grep -Eo "Test run with [0-9]+ tests" test.log | head -1 || true)
          if [ -z "$SUMMARY" ]; then
            echo "::error::swift-testing run summary not found — the Testing suite did not execute (toolchain too old?)."
            exit 1
          fi
          COUNT=$(echo "$SUMMARY" | grep -Eo "[0-9]+")
          AUTHORED=$(grep -rohE '@Test' Tests | wc -l | tr -d ' ')
          echo "swift-testing authored=$AUTHORED executed=$COUNT"
          if [ "$COUNT" -lt "$((AUTHORED - 5))" ]; then
            echo "::error::Only $COUNT swift-testing cases executed (authored $AUTHORED, allowed slack 5). Tests are being silently skipped."
            exit 1
          fi
